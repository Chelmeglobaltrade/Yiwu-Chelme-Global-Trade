name: Supabase keepalive
# El plan gratis de Supabase pausa el proyecto tras 7 días sin uso de la base de datos.
# Cada día se llama a public.keepalive(), que hace una consulta real en Postgres.
# Si el proyecto ya está pausado, el job falla y GitHub manda un correo de aviso.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://pvivlnljgpldtlblyvxo.supabase.co
          KEY: sb_publishable_krvbtoyK0RSsBA3g1dspgA_Bkh55PEh
        run: |
          set -e
          curl -fsS --retry 3 --retry-delay 20 "$URL/auth/v1/health" -H "apikey: $KEY"; echo
          body=$(curl -fsS --retry 3 --retry-delay 20 -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "keepalive: $body"
          [ -n "$body" ] && [ "$body" != "null" ]
